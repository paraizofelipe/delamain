# Releases every push to main (a merged PR or a direct push): the next version comes from
# .github/scripts/next-version.sh, VERSION is committed back to main and v<version> is published.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # workflow_dispatch can pick any branch; only main is ever published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history and its tags, to find the last release

      - name: Next version
        id: version
        run: |
          v="$(.github/scripts/next-version.sh)"
          if [ -z "$v" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::HEAD is already released; nothing to do"
            exit 0
          fi
          echo "$v" > VERSION
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if ! rel="$(gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null)"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          want="checksums.txt delamain_darwin_amd64 delamain_darwin_arm64 delamain_linux_amd64 delamain_linux_arm64"
          got="$(jq -r '[.assets[].name] | sort | join(" ")' <<<"$rel")"
          if [ "$(jq -r .isDraft <<<"$rel")" = false ] && [ "$got" = "$want" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::release v$v already published with every asset; nothing to do"
          else
            echo "::error::release v$v is a draft or incomplete (assets: ${got:-none}); delete it with 'gh release delete v$v --cleanup-tag' and run again"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.exists == 'false'
        with:
          go-version-file: go.mod

      - name: Test
        if: steps.version.outputs.exists == 'false'
        run: make test

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: make dist

      - name: Commit VERSION
        id: commit
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        # Pushed with GITHUB_TOKEN, so this commit does not trigger another run.
        run: |
          if ! git diff --quiet VERSION; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -q -m "chore: release $TAG" VERSION
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::$auth"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        # A draft is invisible to releases/latest until every asset is uploaded.
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --target "$SHA" --title "$TAG" --generate-notes
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
